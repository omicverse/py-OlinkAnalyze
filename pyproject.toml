[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyolinkanalyze"
version = "0.1.0"
description = "Pure-Python port of Olink Proteomics' R OlinkAnalyze — NPX I/O, bridge normalization, and per-protein differential expression for Olink proteomics."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Zehua Zeng", email = "starlitnightly@163.com" },
]
keywords = [
    "proteomics", "olink", "npx",
    "differential-expression", "bridge-normalization",
    "mixed-models", "biomarkers",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "pandas>=1.5",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff"]
plotting = ["matplotlib>=3.6"]

[project.urls]
Homepage = "https://github.com/omicverse/py-OlinkAnalyze"
Repository = "https://github.com/omicverse/py-OlinkAnalyze"
Issues = "https://github.com/omicverse/py-OlinkAnalyze/issues"
"Upstream CRAN package" = "https://cran.r-project.org/package=OlinkAnalyze"
"Upstream (omicverse)" = "https://github.com/Starlitnightly/omicverse"

[tool.setuptools.packages.find]
include = ["pyolinkanalyze*"]
exclude = ["tests*", "examples*", "OlinkAnalyze-ref*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore::RuntimeWarning",
]
